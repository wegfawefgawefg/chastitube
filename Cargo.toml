[package]
name = "chastitube"
version = "0.2.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
