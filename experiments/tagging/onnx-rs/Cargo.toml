[package]
name = "laya-onnx-test"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = "2.0.0-rc.15"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
